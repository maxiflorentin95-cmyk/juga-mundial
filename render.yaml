services:
  - type: web
    name: juga-mundial
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node --dns-result-order=ipv4first server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
